# 异构硬件先导：性能配置选择与科研预算严格分离。标准测试集封存。
name: hardware-pilot-v1
sizes: [100, 500]
seeds: [1001, 1002, 1003]
population: 100
batch: 32
generations: 3
validation_interval: 5
validation_repeats: 3
paired_blocks: 5
candidate_lanes: [4, 8, 16, 32]
active_sm_multipliers: [2, 4]
default_active_tasks: 3200
minimum_fractional_time_reduction: 0.03
capacity_batch: 128
capacity_active_tasks: [3200, 12800]
search:
  variant: as
  ants: 32
  iterations: 500
  candidate_size: 20
