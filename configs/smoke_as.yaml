# 仅用于安装/CLI 闭环检查；不得用于论文结果。
experiment:
  experiment_id: smoke-as
  root_seed: 7
  train_scales: [50]
  validation_scales: [50]
  test_scales: [50]
  validation_seeds: 1
  noninferiority_tolerance: 0.1

aco:
  variant: as
  ants: 2
  iterations: 1
  dtype: float64
  device: cpu
  candidate_size: 5

gp:
  population_size: 6
  generations: 1
  elite_size: 1
  tournament_size: 2
  initial_min_depth: 1
  initial_max_depth: 2
  max_depth: 3
  max_nodes_per_tree: 31
  checkpoint_interval: 1
  checkpoint_top_k: 2

runtime:
  processes: 1
  torch_threads: 1
  torch_interop_threads: 1
  multiprocessing_start_method: spawn
  deterministic_algorithms: true

data:
  root: Datasets/TSP
  train:
    50: [train_dataset/tsp/tsp_50/tsp50_uniform_128k_1.txt]
  validation:
    50: [val_dataset/tsp/tsp50_uniform_val.txt]
  test:
    tsp50_uniform:
      scale: 50
      distribution: uniform
      files: [test_dataset/tsp/tsp50_concorde_5.688.txt]
  train_instances_per_scale: 1
  validation_instances_per_scale: 1
  evaluation_batch_size: 1
