# 三种 ACO、八个核心方法、三 GP seeds 的纯 TSP100 消融与 OOD pilot。
study_id: tsp100-ablation-gpu1-3seed-v1
output_root: runs/tsp100-ablation-gpu1-3seed
phase: pilot

test_root_seed: 9001
test_seeds: 3
partitions:
  - tsp50_uniform
  - tsp100_uniform
  - tsp500_uniform
  - tsp1000_uniform
  - tsp500_cluster
  - tsp500_gaussian
  - tsplib_le500

methods:
  legacy: train
  matched-replace: train
  tr-rgp: train
  ph-rgp: train
  rmtgp-core-f0: train
  rmtgp-core-f1: train
  rmtgp-full-f0: train
  rmtgp-full-f1: reuse

variants:
  as:
    config: configs/as_tsp100_ablation_gpu1.yaml
    seeds: [1001, 1002, 1003]
  acs:
    config: configs/acs_tsp100_ablation_gpu1.yaml
    seeds: [2001, 2002, 2003]
  mmas:
    config: configs/mmas_tsp100_ablation_gpu1.yaml
    seeds: [3001, 3002, 3003]

reuse:
  config: experiments/tsp100_gpu0_3seed/study.yaml
  root: runs/tsp100-gpu0-3seed

manifest: Datasets/manifest.json
bootstrap_replicates: 10000
