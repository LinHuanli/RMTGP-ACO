# ACS 单卡训练实例预算实验：每代 32 个纯 TSP100 实例。
experiment:
  experiment_id: tsp100-instance-budget-acs-n32
  root_seed: 2001
  train_scales: [100]
  validation_scales: [100]
  test_scales: [50, 100, 500, 1000]
  validation_seeds: 3
  validation_screening_seeds: 1
  validation_top_k: 5
  noninferiority_tolerance: 0.1

aco:
  variant: acs
  ants: 32
  iterations: 500
  dtype: float64
  device: cpu
  candidate_size: 20
  acs_synchronous: true
  gamma_transition: 0.3333333333333333
  gamma_pheromone: 0.3333333333333333

gp:
  population_size: 100
  generations: 50
  crossover_probability: 0.80
  mutation_probability: 0.15
  reproduction_probability: 0.05
  elite_size: 10
  tournament_size: 4
  initial_min_depth: 2
  initial_max_depth: 4
  max_depth: 5
  max_nodes_per_tree: 31
  max_total_nodes: 31
  checkpoint_interval: 5
  checkpoint_top_k: 5
  degradation_penalty: 0.0
  train_transition: true
  train_pheromone: true

runtime:
  processes: 1
  cpu_threads: 16
  torch_threads: 1
  torch_interop_threads: 1
  multiprocessing_start_method: spawn
  deterministic_algorithms: true
  aco_backend: cuda_tiled_v2
  gpu_devices: [0]
  gpu_mode: single
  gpu_block_threads: 0
  gpu_memory_fraction: 0.80
  gpu_task_chunk_size: 0
  cuda_provider: raw_cuda
  cuda_precision: fp32_fast
  cuda_candidate_lanes: 8
  cuda_register_cap: 0
  cuda_task_order: instance_major
  cuda_generated_gp: true
  cuda_graph_replay: false
  cuda_tuning_manifest: configs/cuda_tuning/rtx_pro5000_blackwell_sm120_v1.json

data:
  root: Datasets/TSP
  train:
    100: [train_dataset/tsp/tsp_100/tsp100_uniform_128k_*.txt]
  validation:
    100: [val_dataset/tsp/tsp100_uniform_val.txt]
  test:
    tsp50_uniform:
      scale: 50
      distribution: uniform
      files: [test_dataset/tsp/tsp50_concorde_5.688.txt]
    tsp100_uniform:
      scale: 100
      distribution: uniform
      files: [test_dataset/tsp/tsp100_concorde_7.756.txt]
    tsp500_uniform:
      scale: 500
      distribution: uniform
      files: [test_dataset/tsp/tsp500_concorde_16.546.txt]
    tsp1000_uniform:
      scale: 1000
      distribution: uniform
      files: [test_dataset/tsp/tsp1000_concorde_23.118.txt]
  train_instances_per_scale: 32
  validation_selection_instances_per_scale: 32
  validation_gate_instances_per_scale: 32
  evaluation_batch_size: 32
  baseline_archive: runs/tsp100-instance-budget-single-gpu/baselines/n32
  baseline_policy: require
