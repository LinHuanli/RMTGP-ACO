# TSP500 full-2opt LS-aware RMTGP-ACO v2 正式训练模板。
# campaign 仅覆盖 variant、root_seed、experiment_id 和 fixed TR checkpoint。
experiment:
  experiment_id: tsp500-2opt-ls-v2-template
  root_seed: 81001
  train_scales: [500]
  validation_scales: [500]
  test_scales: [500]
  validation_seeds: 3
  validation_screening_seeds: 1
  validation_top_k: 5
  noninferiority_tolerance: 0.0
  selection_mode: strict_superiority
  superiority_min_relative_improvement: 0.10
  selection_confidence: 0.95
  selection_bootstrap_replicates: 10000
  quality_tie_tolerance: 0.01
  training_horizon_schedule:
    - [15, 100]
    - [35, 200]
    - [50, 500]
  validation_monitor_interval: 5
  cpu_fp64_final_audit: false

aco:
  variant: acs
  ants: 32
  iterations: 5000
  dtype: float64
  device: cpu
  candidate_size: 20
  alpha: 1.0
  beta: 2.0
  rho: 0.1
  q0: 0.98
  xi: 0.1
  acs_synchronous: true
  gamma_transition: 0.3333333333333333
  gamma_pheromone: 0.3333333333333333
  transition_integration: residual
  pheromone_integration: budget_residual
  local_search: two_opt
  local_search_profile: acotsp
  local_search_candidate_size: 20
  local_search_dlb: true
  ls_gain_semantics: edge_last_move

gp:
  population_size: 100
  generations: 50
  crossover_probability: 0.80
  mutation_probability: 0.15
  reproduction_probability: 0.05
  elite_size: 10
  tournament_size: 4
  initial_min_depth: 2
  initial_max_depth: 5
  max_depth: 7
  max_nodes_per_tree: 62
  max_total_nodes: 62
  checkpoint_interval: 5
  checkpoint_top_k: 5
  degradation_penalty: 0.0
  train_transition: true
  train_pheromone: true
  transition_profile: main
  function_profile: f1
  transition_terminals:
    - RTau
    - REta
    - BaseConf
    - DistRank
    - Entropy
    - ConstructProg
    - ACOProg
    - Stagnation
    - MutualRank
    - TurnCos
  pheromone_terminals:
    - EdgeEta
    - EdgeTau
    - NNRank
    - ColonyFreq
    - SourceQuality
    - ACOProg
    - Stagnation
    - Origin
    - LSGain
    - PreFreq
    - PostFreq
    - TauHeadroom
  fitness_mode: paired_final_anytime_mean
  fitness_ucb_z: 0.0
  baseline_anchor: true
  basin_top_q: 7
  basin_weight: 0.8
  anytime_weight: 0.5
  phase_a_end_generation: 10
  phase_b_end_generation: 30
  fixed_transition_checkpoint: runs/tsp100-ablation-gpu1-3seed.nfs-checkpoint-20260727T1740NZST/train/tr-rgp/acs/seed-2001/selected_candidate.pkl
  pheromone_role_probability: 0.7
  max_structural_copies: 2

racing:
  enabled: true
  screen_instances_per_scale: 16
  high_instances_per_scale: 32
  finalists: 32
  exploration_finalists: 4
  preserved_elites: 4
  screen_horizon_schedule:
    - [15, 50]
    - [35, 100]
    - [50, 200]
  screen_fitness_mode: paired_basin_mean
  screen_instance_schedule:
    - [15, 16]
    - [35, 32]
    - [50, 64]
  high_instance_schedule:
    - [15, 32]
    - [35, 64]
    - [50, 128]
  high_seed_schedule:
    - [15, 1]
    - [35, 2]
    - [50, 3]

runtime:
  processes: 1
  cpu_threads: 16
  torch_threads: 1
  torch_interop_threads: 1
  multiprocessing_start_method: spawn
  deterministic_algorithms: true
  aco_backend: cuda_tiled_v2
  gpu_devices: [0]
  gpu_mode: single
  gpu_block_threads: 0
  gpu_memory_fraction: 0.80
  gpu_task_chunk_size: 0
  cuda_provider: raw_cuda
  cuda_precision: fp32_fast
  cuda_candidate_lanes: 8
  cuda_register_cap: 0
  cuda_task_order: instance_major
  cuda_generated_gp: true
  cuda_graph_replay: false
  cuda_tuning_manifest: configs/cuda_tuning/rtx_pro5000_blackwell_sm120_v1.json
  cuda_ls_warps_per_block: 8
  cuda_three_opt_block_threads: 512

data:
  root: Datasets/TSP
  train:
    500: [train_dataset/tsp/tsp_500/tsp500_uniform_16k_*.txt]
  validation:
    500: [val_dataset/tsp/tsp500_uniform_val.txt]
  test:
    tsp500_uniform:
      scale: 500
      distribution: uniform
      files: [test_dataset/tsp/tsp500_concorde_16.546.txt]
    tsp500_cluster:
      scale: 500
      distribution: cluster
      files: [test_dataset/tsp/tsp500_cluster_10.723.txt]
    tsp500_gaussian:
      scale: 500
      distribution: gaussian
      files: [test_dataset/tsp/tsp500_gaussian_77.521.txt]
  train_instances_per_scale: 128
  validation_selection_instances_per_scale: 16
  validation_gate_instances_per_scale: 48
  evaluation_batch_size: 32
  baseline_policy: compute
