# RMTGP-ACO+2opt v2 的冻结公共配置。
# variant、fitness mode、residual radius 和 root seed 由 campaign 显式覆盖。
experiment:
  experiment_id: tsp100-2opt-signal-v2-template
  root_seed: 31001
  train_scales: [100]
  validation_scales: [100]
  test_scales: [100]
  validation_seeds: 5
  validation_screening_seeds: 2
  validation_top_k: 5
  noninferiority_tolerance: 0.0
  selection_mode: strict_superiority
  superiority_min_relative_improvement: 0.10
  selection_confidence: 0.95
  selection_bootstrap_replicates: 10000
  quality_tie_tolerance: 0.01
  validation_monitor_interval: 1
  cpu_fp64_final_audit: true

aco:
  variant: acs
  ants: 32
  iterations: 5000
  dtype: float64
  device: cpu
  candidate_size: 20
  alpha: 1.0
  beta: 2.0
  rho: 0.1
  q0: 0.98
  xi: 0.1
  acs_synchronous: true
  gamma_transition: 0.3333333333333333
  gamma_pheromone: 0.3333333333333333
  transition_integration: residual
  pheromone_integration: budget_residual
  local_search: two_opt
  local_search_profile: acotsp
  local_search_candidate_size: 20
  local_search_dlb: true

gp:
  population_size: 100
  generations: 50
  crossover_probability: 0.80
  mutation_probability: 0.15
  reproduction_probability: 0.05
  elite_size: 10
  tournament_size: 4
  initial_min_depth: 2
  initial_max_depth: 5
  max_depth: 7
  max_nodes_per_tree: 62
  max_total_nodes: 62
  checkpoint_interval: 5
  checkpoint_top_k: 5
  degradation_penalty: 0.0
  train_transition: true
  train_pheromone: true
  transition_profile: main
  function_profile: f1
  # 默认集合不含 LSGain，也不含需要审计门控后才加入的 Origin。
  transition_terminals:
    - RTau
    - REta
    - BaseConf
    - DistRank
    - Entropy
    - ConstructProg
    - ACOProg
    - Stagnation
  pheromone_terminals:
    - EdgeEta
    - EdgeTau
    - NNRank
    - ColonyFreq
    - SourceQuality
    - ACOProg
    - Stagnation
  fitness_mode: paired_combined_ucb
  fitness_ucb_z: 1.0
  baseline_anchor: true
  basin_top_q: 7
  basin_weight: 0.8

runtime:
  processes: 1
  cpu_threads: 16
  torch_threads: 1
  torch_interop_threads: 1
  multiprocessing_start_method: spawn
  deterministic_algorithms: true
  aco_backend: cuda_tiled_v2
  gpu_devices: [0]
  gpu_mode: single
  gpu_block_threads: 0
  gpu_memory_fraction: 0.80
  gpu_task_chunk_size: 0
  cuda_provider: raw_cuda
  cuda_precision: fp32_fast
  cuda_candidate_lanes: 8
  cuda_register_cap: 0
  cuda_task_order: instance_major
  cuda_generated_gp: true
  cuda_graph_replay: false
  cuda_tuning_manifest: configs/cuda_tuning/rtx_pro5000_blackwell_sm120_v1.json
  cuda_ls_warps_per_block: 8
  cuda_three_opt_block_threads: 512

data:
  root: Datasets/TSP
  train:
    100: [train_dataset/tsp/tsp_100/tsp100_uniform_128k_*.txt]
  validation:
    100: [val_dataset/tsp/tsp100_uniform_val.txt]
  test:
    tsp100_uniform:
      scale: 100
      distribution: uniform
      files: [test_dataset/tsp/tsp100_concorde_7.756.txt]
  train_instances_per_scale: 128
  validation_selection_instances_per_scale: 128
  validation_gate_instances_per_scale: 512
  evaluation_batch_size: 128
  baseline_policy: require
