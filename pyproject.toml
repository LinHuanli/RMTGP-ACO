[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpaco-gpu-research"
version = "0.1.0"
description = "Reproducible population evaluation for single-tree GP-ACO"
requires-python = ">=3.12"
dependencies = ["numpy==2.4.6", "numba==0.68.0", "llvmlite==0.50.0", "deap==1.4.3", "PyYAML==6.0.2"]

[project.optional-dependencies]
cuda = ["cupy-cuda13x==14.2.0", "torch==2.14.0"]
dev = ["pytest>=8", "ruff>=0.11", "matplotlib>=3.9"]

[project.scripts]
gpaco = "gpaco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpaco = ["backends/cuda/*.cu", "backends/cuda/*.cuh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: 需要一张独占可见 CUDA GPU", "slow: 完整搜索与较大数据检查"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
