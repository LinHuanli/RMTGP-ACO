[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmtgp-aco"
version = "0.1.0"
description = "面向 Euclidean TSP 的 Strongly Typed Multi-Tree GP–ACO 研究实现"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Research use; bundled ACOTSP reference retains its original GPL license"}
dependencies = [
  "deap>=1.4,<2",
  "numpy>=2.0,<2.3",
  "numba>=0.61,<1",
  "PyYAML>=6,<7",
  "scipy>=1.14,<2",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
rmtgp-aco = "rmtgp_aco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
